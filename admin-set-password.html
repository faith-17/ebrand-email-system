
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Your Password | eBrand Promotion</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Admin CSS -->
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-login-page">

    <main class="login-container">

        <div class="login-card">

            

            <div class="login-heading">
    <h2>Create Your Password</h2>
    <p>Set a secure password to access your admin dashboard.</p>
</div>
           

            <!-- Feedback Message -->
              <div id="passwordMessage" class="login-message"></div>
              
            <!-- Password Setup Form -->
            <form id="setPasswordForm">

                <div class="mb-3">
                    <label for="newPassword" class="form-label">
                        New Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="newPassword"
                           placeholder="Enter your password"
                           minlength="8"
                           required>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="confirmPassword"
                           placeholder="Confirm your password"
                           minlength="8"
                           required>
                </div>

               

                <button type="submit"
                        class="btn login-btn w-100"
                        id="setPasswordButton">
                    Set Password
                </button>

            </form>
            <!-- End Password Setup Form -->

            <p class="login-footer">
                eBrand Promotion Admin Portal
            </p>

        </div>
        <!-- End Login Card -->

    </main>
    <!-- End Login Container -->

    <script src="js/admin-set-password.js"></script>

</body>
</html>
