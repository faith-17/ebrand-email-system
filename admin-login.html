
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | eBrand Promotion</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Admin Custom CSS -->
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-login-page">

    <!-- Main Login Section -->
    <main class="login-container">

        <!-- Login Card -->
        <div class="login-card">

            <!-- Company Logo -->
           <!-- <div class="login-logo">
                <img src="images/logo-img.svg"
                    alt="eBrand Promotion Logo">
            </div>-->

            <!-- Welcome Heading -->
            <div class="login-heading">
                <h1>Welcome Back</h1>
                <p>Sign in to access your enquiries.</p>
            </div>

            <!-- Admin Login Form -->
            <form id="adminLoginForm">

                <!-- Username Field -->
                <div class="mb-4">
                    <label for="adminUsername" class="form-label">
                        Username
                    </label>

                    <input type="email"
                        class="form-control"
                        id="adminUsername"
                        name="username"
                        placeholder="Enter admin email"
                        autocomplete="username"
                        required>
                </div>

                <!-- Password Field -->
                <div class="mb-4">
                    <label for="adminPassword" class="form-label">
                        Password
                    </label>

                    <div class="password-wrapper">
                        <input type="password"
                            class="form-control"
                            id="adminPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Login Feedback -->
                <div id="loginMessage"
                    class="login-message"
                    role="status"
                    aria-live="polite">
                </div>

                <!-- Login Button -->
                <button type="submit"
                    class="btn login-btn w-100"
                    id="loginButton">
                    See Message
                </button>

            </form>

            <!-- Footer -->
            <div class="login-footer">
                <p>eBrand Promotion &copy; 2026</p>
            </div>

        </div>
        <!-- End Login Card -->

    </main>
    <!-- End Main Login Section -->

    <!-- Admin Login JavaScript -->
    <script src="js/admin-login.js"></script>

</body>
</html>
